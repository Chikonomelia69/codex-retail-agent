name: CODEX CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Syntax & Lint Verification
      run: |
        python -m py_compile app.py test_pipeline.py src/*.py

    - name: Verify Core Business Tools
      run: |
        python -c "
        from src.tools import calculate_return_and_warranty_window, lookup_order_status
        res = calculate_return_and_warranty_window.invoke({'item_name': 'Test Item', 'category': 'Consumer Electronics & Gadgets', 'purchase_date_str': '2026-08-27', 'current_date_str': '2026-09-21'})
        assert 'EXPIRING_SOON' in res, 'Failed date math test'
        order = lookup_order_status.invoke({'order_id': 'ORD-1001'})
        assert 'Delivered' in order, 'Failed order lookup test'
        print('All core tool tests passed successfully!')
        "
