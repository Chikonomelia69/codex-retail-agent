# Netlify Configuration for CodeX Autonomous Retail Agent

[build]
  command = "npm run build"
  publish = "dist"

# Redirect all paths to index.html for SPA client-side routing & deep linking
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
